name: Build and Release Sunny Desktop AI

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Executables (.exe & installer)
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Safety Unit Tests
        run: npm test

      - name: Build Web Application
        run: npm run build

      - name: Build Electron Main & Preload
        run: npm run build:electron-main

      - name: Package Windows .exe (Installer & Portable)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis portable zip

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sunny-windows-binaries
          path: |
            release/*.exe
            release/*.zip
            release/*.blockmap

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          name: Sunny Desktop AI ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.zip
