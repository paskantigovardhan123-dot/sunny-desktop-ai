appId: com.sunny.desktop-companion
productName: Sunny
copyright: Copyright © 2026 Sunny Desktop AI
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: public/icon.ico
  artifactName: ${productName}-Setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Sunny AI Companion
